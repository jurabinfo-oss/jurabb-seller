<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - ThriftLoop</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../seller/seller.css">
    <link rel="stylesheet" href="customer.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-heart"></i> ThriftLoop</h2>
                <p class="customer-badge"><i class="fas fa-user"></i> My Account</p>
            </div>
            <nav class="sidebar-nav">
                <a href="#profile" class="nav-item active" onclick="showSection('profile')"><i class="fas fa-user-circle"></i> Profile</a>
                <a href="#orders" class="nav-item" onclick="showSection('orders')"><i class="fas fa-shopping-bag"></i> My Orders <span class="badge" id="ordersBadge">0</span></a>
                <a href="#shop" class="nav-item" onclick="window.location.href='../../index.html#products'"><i class="fas fa-store"></i> Continue Shopping</a>
            </nav>
            <div class="sidebar-footer">
                <a href="../../index.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Back to Home</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <div class="header-left">
                    <h1 id="sectionTitle">My Profile</h1>
                    <p class="header-subtitle">Manage your account & orders</p>
                </div>
                <div class="header-right">
                    <div class="customer-info">
                        <div class="customer-avatar" id="headerAvatar">C</div>
                        <div class="customer-details">
                            <p class="customer-name" id="headerName">Buyer</p>
                            <p class="customer-email" id="headerEmail">-</p>
                        </div>
                    </div>
                </div>
            </header>

            <section id="profile" class="content-section active">
                <div class="dashboard-card">
                    <div class="card-header"><h3><i class="fas fa-user"></i> Personal Information</h3></div>
                    <div class="profile-form">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="profileName" readonly>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="profileEmail" readonly>
                        </div>
                    </div>
                </div>
            </section>

            <section id="orders" class="content-section">
                <div class="section-header"><h2>My Orders</h2></div>
                <div class="orders-list-full" id="ordersList"><p class="empty-note">Loading...</p></div>
            </section>
        </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="customer.js"></script>
</body>
</html>
