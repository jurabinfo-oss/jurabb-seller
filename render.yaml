# Render Blueprint for the ThriftLoop backend.
# Uses Render Postgres so accounts, products, orders and uploaded photos survive
# Free web-service sleep/restarts. Note: Render Free Postgres expires after 30 days.
services:
  - type: web
    name: thriftloop-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: THRIFTLOOP_ADMIN_EMAIL
        sync: false
      - key: THRIFTLOOP_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: thriftloop-db
          property: connectionString

databases:
  - name: thriftloop-db
    databaseName: thriftloop
    user: thriftloop
    plan: free
